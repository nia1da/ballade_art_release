name: ballade_art
description: "Ring Sizer by BalladeArt Jewellery Studio"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9
  video_player: ^2.9.1
  device_info_plus: ^10.1.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.1
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1


flutter_launcher_icons:
  android: true
  ios: false
  # FIX: legacy icon — solid background, logo can be larger
  image_path: "assets/images/app_icon_legacy.png"
  # FIX: adaptive icon — transparent bg, logo small+centered with padding
  adaptive_icon_background: "#222831"
  adaptive_icon_foreground: "assets/images/app_icon_fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/misc/
    - assets/icons/
    - assets/videos/help.mp4

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#222831"
  image: assets/images/splash_logo.png
  android: true
  ios: false
  fullscreen: true
  android_12:
    color: "#222831"
    image: assets/images/splash_logo.png
  android_gravity: center